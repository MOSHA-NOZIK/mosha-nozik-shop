<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Логотип магазина игр" class="logo__img">
        </a>
        <nav class="nav" aria-label="Основное меню">
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">ГЛАВНАЯ</a></li>
                <li><a href="shop.html" class="nav__link">КАТАЛОГ ИГР</a></li>
                <li><a href="cart.html" class="nav__link">КОРЗИНА</a></li>
                <li id="navAuthLink">
                    <a href="login.html" class="nav__link">ВОЙТИ</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <h1 class="visually-hidden">Корзина</h1>
        <section class="cart-content">
            <div class="cart-list" id="cartList"></div>

            <p class="catalog__empty" id="cartEmpty" hidden>Ваша корзина пуста. Добавьте игры из каталога.</p>

            <div class="cart-summary" hidden>
                <div class="cart-summary__total">ИТОГО: <span id="cartTotal">0</span> РУБЛЕЙ</div>
                <button class="buy-button" type="button">КУПИТЬ</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; MOSHA_NOZIK 2026. Все права защищены?)</p>
    </footer>
</body>
</html>
