<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MOSHA_NOZIK</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Логотип магазина игр" class="logo__img">
        </a>
        <nav class="nav" aria-label="Основное меню">
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">ГЛАВНАЯ</a></li>
                <li><a href="shop.html" class="nav__link">КАТАЛОГ ИГР</a></li>
                <li><a href="cart.html" class="nav__link">КОРЗИНА</a></li>
                <li id="navAuthLink">
                    <a href="login.html" class="nav__link">ВОЙТИ</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main main--centered">
        <section class="auth-form-container">
            <h2 class="auth-title">РЕГИСТРАЦИЯ</h2>
            <form id="registerForm" class="feedback-form">
                <div class="form-group">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" id="username" name="username" class="form-input" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password" class="form-input" required minlength="4">
                </div>
                <button type="submit" class="form-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
                <p class="auth-error" id="registerError"></p>
                <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; MOSHA_NOZIK 2026. Все права защищены?)</p>
    </footer>
</body>
</html>
